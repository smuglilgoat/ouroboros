<!doctype html>
<html>
  <body style="font-family: system-ui; font-size: 13px; max-width: 460px">
    <h3>Ouroboros Wiki Capture</h3>
    <p><label>GitHub repo (owner/repo)<br><input id="repo" size="30" placeholder="me/my-wiki"></label></p>
    <p><label>GitHub PAT (fine-grained, Contents: read/write on that repo)<br>
      <input id="pat" type="password" style="width: 100%"></label></p>
    <p><label>Branch (blank = default)<br><input id="branch" size="20"></label></p>
    <p><label>Inbox folder<br><input id="inboxDir" value="inbox"></label></p>
    <p><label>Extra instructions for the model (optional)<br>
      <textarea id="extraInstructions" rows="3" style="width: 100%" placeholder="e.g. Prioritize sources in French; always link to [[psychanalyse]]"></textarea></label></p>
    <p><label>Companion URL<br><input id="companionUrl" value="http://localhost:7781/ingest" style="width: 100%"></label></p>
    <p><button id="save">Save</button> <span id="saved"></span></p>
    <script src="options.js"></script>
  </body>
</html>
